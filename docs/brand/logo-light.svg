<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 48" width="212" height="48" role="img" aria-label="SlotBook">
  <!-- SlotBook logo (light backgrounds): a 3x3 grid of time slots with one booked in coral, then the name. -->
  <rect width="48" height="48" rx="12" fill="#0f766e"/>
  <g fill="#ffffff" fill-opacity="0.35">
    <rect x="10.5" y="10.5" width="7.5" height="7.5" rx="2.25"/><rect x="20.25" y="10.5" width="7.5" height="7.5" rx="2.25"/><rect x="30" y="10.5" width="7.5" height="7.5" rx="2.25"/>
    <rect x="10.5" y="20.25" width="7.5" height="7.5" rx="2.25"/><rect x="30" y="20.25" width="7.5" height="7.5" rx="2.25"/>
    <rect x="10.5" y="30" width="7.5" height="7.5" rx="2.25"/><rect x="20.25" y="30" width="7.5" height="7.5" rx="2.25"/><rect x="30" y="30" width="7.5" height="7.5" rx="2.25"/>
  </g>
  <rect x="20.25" y="20.25" width="7.5" height="7.5" rx="2.25" fill="#f0997b"/>
  <text x="60" y="34" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" letter-spacing="-0.3" fill="#1c1b19">Slot<tspan fill="#d85a30">Book</tspan></text>
</svg>
