# ─── Render Blueprint ────────────────────────────────────────────────────────
# Creates what the SlotBook API needs on Render, in one go:
#   slotbook-redis  Key Value (Redis) for the reminder queue and rate limits
#   slotbook-api    the API, built from the Dockerfile
#
# The PostgreSQL database is NOT on Render: Render's free database expires after
# 30 days, so it lives on Neon's free plan instead (no expiry; Singapore region,
# next to the API). DATABASE_URL is set by hand in the Render dashboard.
#
# In the Render dashboard: New > Blueprint, then pick this repository.
# Step-by-step instructions are in docs/DEPLOY.md.
#
# Both services are in Singapore, the closest region to India, and must stay in one
# region so the API can reach Redis over Render's private network.
#
# Free plans (check https://render.com/docs/free for the current limits): the API
# sleeps after 15 minutes without visitors and takes about a minute to wake; free
# Redis keeps nothing on restart.
# ──────────────────────────────────────────────────────────────────────────────

services:
  - type: keyvalue
    name: slotbook-redis
    plan: free
    region: singapore
    # BullMQ keeps its jobs in Redis, so Redis must never throw keys away to free memory.
    maxmemoryPolicy: noeviction
    # No access from the internet at all. The API reaches it over Render's private network.
    ipAllowList: []

  - type: web
    name: slotbook-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Neon's DIRECT connection string (DATABASE_URL_UNPOOLED, not the "-pooler" one):
      # the API runs Prisma migrations on start, and those need a direct connection.
      # sync: false = Render asks for it once and never overwrites it from this file.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: slotbook-redis
          property: connectionString
      # Render generates a random 256-bit value. It lives only in Render's settings, never in the repository.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Render puts exactly one proxy in front of the API (see docs/DEPLOY.md before changing this).
      - key: TRUST_PROXY
        value: "1"
      # The web app's address, like https://slotbook.vercel.app. Render asks for it when the Blueprint is created.
      - key: CORS_ORIGIN
        sync: false
